# 📝 Docker Compose para Desarrollo con Maven (hot-reload)
# Uso: docker-compose -f docker-compose.dev.yml up -d
# Útil para desarrollo rápido con cambios de código en vivo

version: '3.9'

services:
  app:
    image: maven:3.9.9-eclipse-temurin-21-alpine
    container_name: clinica_app_dev
    working_dir: /app
    volumes:
      - ./:/app:delegated
      - m2_cache:/root/.m2/repository
    ports:
      - "8080:8080"
      - "5005:5005"  # Puerto para debug remoto
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/clinica_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - MAVEN_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: mvn -B spring-boot:run
    networks:
      - clinica_network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: postgres_clinica_dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    networks:
      - clinica_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  clinica_network:
    driver: bridge

volumes:
  db_data_dev:
  m2_cache:
